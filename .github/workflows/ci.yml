# CI on every push and PR: the same gates the publish job runs before a tag
# may ship. Publishing itself stays in publish-npm.yml, which runs on tags only.
#
# Run it by hand with `openapi_source` (a URL of the app's exported
# docs/developers/openapi.json) to test this client against that API: the
# snapshot in tests/openapi.json is refreshed from it before the checks.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      openapi_source:
        description: "URL of the app's openapi.json to test against (blank: the committed snapshot)"
        required: false
        default: ""

# The workflow token reads the repository and nothing else; a job that
# needs more says so itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh the OpenAPI snapshot from the given source
        if: github.event_name == 'workflow_dispatch' && inputs.openapi_source != ''
        env:
          OPENAPI_SOURCE: ${{ inputs.openapi_source }}
        run: |
          pnpm openapi:refresh "$OPENAPI_SOURCE"
          git diff --stat tests/openapi.json
      # The agent contract's one source is the Python SDK's contract.json;
      # src/agent/contract.ts is generated from it. Check that repo out beside
      # this one (the same branch when it has one) and make the suite compare.
      - name: Check out the Python SDK beside this repo
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 --branch "$BRANCH" https://github.com/MatterWaveAI/python-sdk ../python-sdk \
            || git clone --depth 1 https://github.com/MatterWaveAI/python-sdk ../python-sdk
      - run: pnpm lint
      - name: No private ticket ids in tracked files
        run: sh scripts/check-ticket-ids.sh
      - run: pnpm typecheck
      - run: pnpm test
        env:
          MATTERWAVE_AGENT_CONTRACT: ../python-sdk/src/matterwave_sdk/agent/contract.json
      - run: pnpm build
      # Each module format resolves to declarations of its own format.
      - run: pnpm attw

  # Every commit on the branch, not just the tip: a secret removed in a
  # later commit is still in the history anyone can clone.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan the history for committed secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .
