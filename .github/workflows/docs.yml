# The API reference: typedoc over the package's two entry points ("." and
# "./agent"), failing on any warning, checked to cover every export, and
# uploaded as the `api-reference` artifact. That artifact is what the docs
# site publishes.
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the reference
        run: >
          pnpm dlx typedoc@0.28.14 --entryPoints src/index.ts src/agent/node.ts
          --excludeInternal --treatWarningsAsErrors --out reference --json reference.json
      - name: Every export has its page
        run: node scripts/check-reference.mjs reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-reference
          path: reference
